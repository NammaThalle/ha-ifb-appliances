name: Feature Request
description: Suggest an idea or feature for the IFB Washer Cloud integration
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve the IFB Washer Cloud integration!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the limitation.
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear description of the feature or behavior you want added.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any screenshots, model details, or context here.
    validations:
      required: false
